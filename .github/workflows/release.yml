name: Release

# Tag-driven, not push-driven. Pushing to main should never publish:
# releases are deliberate, and a tag is the only unambiguous way to say
# "this exact commit is version X". The tag name becomes the version.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:        # manual re-run from the Actions tab

permissions:
  contents: write           # needed to create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The packager reads the git history to build the changelog, so
          # a shallow clone would produce an empty one.
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@master
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          # Optional; the step still succeeds if these are unset.
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
